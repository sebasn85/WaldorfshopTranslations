name: Publish isolated read-only review
on:
  push:
    branches: [test/reviewed-open-jobs-2026-10-24]
    paths: [.github/workflows/publish-open-review.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed patch and verify
        env:
          REVIEWED_PATCH: 
        run: |
          echo "$REVIEWED_PATCH" | base64 -d | gzip -d > /tmp/reviewed.patch
          echo "d671670fb04ac22930d1788a63ce81cc0fef1e3decd58b0bd0638f50773b925d  /tmp/reviewed.patch" | sha256sum -c -
          git apply --check /tmp/reviewed.patch
          git apply /tmp/reviewed.patch
          find src tests resources -name '*.php' -print0 | xargs -0 -n 1 php -l
          php tests/run.php
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md plugin.json src tests
          git commit -m "Inspect open jobs without writes or paid requests"
          git push origin HEAD:test/reviewed-open-jobs-2026-10-24
