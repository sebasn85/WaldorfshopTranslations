name: Publish reviewed recovery fix
on:
  push:
    branches: [fix/recovery-and-budget-2026-10-23]
    paths: [.github/workflows/publish-recovery.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed patch and run regression suite
        env:
          RECOVERY_PATCH: 
        run: |
          echo "$RECOVERY_PATCH" | base64 -d | gzip -d > /tmp/recovery.patch
          echo "80e266efad5fb7d6ce4cf519d310e1d7a5c61deed66cd6581163273a3eab994c  /tmp/recovery.patch" | sha256sum -c -
          git apply --check /tmp/recovery.patch
          git apply /tmp/recovery.patch
          find src tests resources -name '*.php' -print0 | xargs -0 -n 1 php -l
          php tests/run.php
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md plugin.json src tests tools/test-php.mjs
          git commit -m "Fix reviewed translation recovery and billed usage tracking"
          git push origin HEAD:fix/recovery-and-budget-2026-10-23
