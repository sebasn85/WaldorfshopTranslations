name: Publish reviewed retained-source fix
on:
  push:
    branches: [fix/reviewed-unblock-2026-10-24]
    paths: [.github/workflows/publish-retained-source.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed patch and verify
        env:
          REVIEWED_PATCH: 
        run: |
          echo "$REVIEWED_PATCH" | base64 -d | gzip -d > /tmp/reviewed.patch
          echo "e0ef509f1a6e90136a3b2666e174f3a37d4ae3de66d23e5dcb115a7335ccf36c  /tmp/reviewed.patch" | sha256sum -c -
          git apply --check /tmp/reviewed.patch
          git apply /tmp/reviewed.patch
          find src tests resources -name '*.php' -print0 | xargs -0 -n 1 php -l
          php tests/run.php
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md plugin.json src tests
          git commit -m "Add reviewed retention of existing translated fields"
          git push origin HEAD:fix/reviewed-unblock-2026-10-24
